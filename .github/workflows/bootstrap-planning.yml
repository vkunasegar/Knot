name: Bootstrap KNOT milestones and issue labels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-planning.yml'

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create and apply KNOT milestones and labels idempotently
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const milestones = [
              ['M0 — Foundation & Design', 'Tauri shell, shared design tokens, domain model, persistence migrations and CI foundation'],
              ['M1 — Reliable Notes Core', 'Rich note editor, safe autosave, connected notes, recovery and export/import'],
              ['M2 — Everyday Workflows', 'Home, Collections, ordered Threads, search and settings'],
              ['M3 — KNOT Experience', 'The Weave, connections interactions, Focus Mode and signature motion'],
              ['M4 — Linux Release & Portability', 'Linux QA/release packaging, accessibility, macOS and Windows build readiness']
            ];
            const phases = Object.fromEntries(milestones.map(([title], i) => ['M' + i, title]));
            const existing = await github.paginate(github.rest.issues.listMilestones, {owner, repo, state: 'all', per_page: 100});
            const byTitle = new Map(existing.map(m => [m.title, m.number]));
            for (const [title, description] of milestones) {
              if (!byTitle.has(title)) {
                const {data} = await github.rest.issues.createMilestone({owner, repo, title, description, state: 'open'});
                byTitle.set(title, data.number);
                core.info('Created milestone: ' + title);
              }
            }
            const labels = [
              ['type:foundation','506A81','Base architecture/design'],
              ['type:feature','C66B54','User facing functionality'],
              ['type:quality','536A64','Testing, performance and delivery'],
              ['priority:P0','98422E','Critical for milestone'],
              ['priority:P1','405B72','Important refinement'],
              ['phase:M0','EEE8DD','Foundation and design'],
              ['phase:M1','EEE8DD','Reliable notes core'],
              ['phase:M2','EEE8DD','Everyday workflows'],
              ['phase:M3','EEE8DD','KNOT experience'],
              ['phase:M4','EEE8DD','Linux release and portability']
            ];
            for (const [name,color,description] of labels) {
              try { await github.rest.issues.createLabel({owner, repo, name, color, description}); }
              catch (e) { if (e.status !== 422) throw e; }
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'all', per_page: 100});
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const match = /^\[(M[0-4])\]\[(P[01])\]/.exec(issue.title);
              if (!match) continue;
              const phase = match[1], priority = match[2];
              const typ = /CI|Tests|QA|Accessibility|Release|Portability|Autosave/i.test(issue.title) ? 'quality' : phase === 'M0' ? 'foundation' : 'feature';
              const desired = ['phase:' + phase, 'priority:' + priority, 'type:' + typ];
              const milestone = byTitle.get(phases[phase]);
              await github.rest.issues.update({owner, repo, issue_number: issue.number, milestone, labels: desired});
              core.info('Updated issue #' + issue.number + ' -> ' + phase);
            }
